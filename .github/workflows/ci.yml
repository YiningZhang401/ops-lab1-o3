name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show build context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' \
            "event_name=$EVENT_NAME" \
            "ref=$REF" \
            "sha=$COMMIT_SHA" \
            "pr_head_sha=$PR_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Run tests
        run: python -m unittest test_wordcount.py

      - name: Package main snapshot
        if: github.event_name == 'push'
        env:
          VERSION: 0.0.0-main
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          PYTHON_VERSION: "3.12.7"
        run: bash scripts/package.sh

      - name: Print checksums
        if: github.event_name == 'push'
        run: sha256sum dist/*.tar.gz

      - name: Upload main artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ops-lab1-o3-${{ github.sha }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
